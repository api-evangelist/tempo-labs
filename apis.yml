aid: tempo-labs
url: https://raw.githubusercontent.com/api-evangelist/tempo-labs/refs/heads/main/apis.yml
name: Tempo Labs
kind: company
description: >-
  Tempo (Tempo Labs) is an AI app builder at tempo.new positioned around the
  "Prompt. Develop. Design. Collaborate." loop - users describe an app in
  natural language, Tempo generates code, and developers iterate either in
  the visual canvas or directly in code. The product targets design-to-code
  and prompt-to-code workflows for React / Next.js apps and is primarily
  consumed as a hosted web product rather than as an API. Public developer
  surface is limited; integrations and connected services (auth, database,
  hosting) are surfaced inside the product rather than via a documented
  public API.
